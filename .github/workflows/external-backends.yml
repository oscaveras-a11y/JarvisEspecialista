name: Real external backends
on:
  pull_request:
    branches: [main, 'claude/gifted-gates-kd07xv']
    paths:
      - 'src/cyber_core/reverse_engineering/**'
      - 'tests/test_external_backends.py'
      - 'scripts/check-real-backends.py'
      - '.github/workflows/external-backends.yml'
      - 'pyproject.toml'
      - 'src/cyber_core/analysis_process/**'
      - 'src/cyber_core/service.py'
      - 'src/cyber_core/cli/**'
      - 'tests/test_external_core.py'
permissions:
  contents: read
concurrency:
  group: external-backends-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: External adapter contracts
        run: python scripts/run-tests.py test_external_backends.py
      - name: CORE external tool contracts
        run: python scripts/run-tests.py test_external_core.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned tools only on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev liblzma-dev libbz2-dev
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          echo "CYBER_GHIDRA_HOME=$RUNNER_TEMP/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/binwalk.crate" https://static.crates.io/crates/binwalk/binwalk-3.1.0.crate
          echo "99d5dc70f5021c55624f098adae4d1de9c1c07d000475664704b675aad7e0811  $RUNNER_TEMP/binwalk.crate" | sha256sum --check
          mkdir "$RUNNER_TEMP/binwalk-source"
          tar -xf "$RUNNER_TEMP/binwalk.crate" -C "$RUNNER_TEMP/binwalk-source"
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 install --path "$RUNNER_TEMP/binwalk-source/binwalk-3.1.0" --locked --root "$RUNNER_TEMP/binwalk"
          echo "CYBER_BINWALK=$RUNNER_TEMP/binwalk/bin/binwalk" >> "$GITHUB_ENV"
      - name: Verify installed Java exporter asset
        run: python -c "from importlib.resources import files; assert files('cyber_core.reverse_engineering').joinpath('ghidra_scripts/ExportPreview.java').is_file()"
      - name: Real Ghidra decompilation and Binwalk scan
        run: python scripts/check-real-backends.py
      - name: Dependencies syntax and existing offline suite
        run: |
          python -m pip check
          python -m compileall -q src scripts tests
          python scripts/run-tests.py
