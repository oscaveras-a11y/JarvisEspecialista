name: Recovery keys validation
on:
  pull_request:
    branches: ['claude/gifted-gates-kd07xv']
permissions:
  contents: read
concurrency:
  group: recovery-keys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      CYBER_REQUIRE_CAPSTONE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[reverse]"
      - run: python -m pip check
      - run: python -m compileall -q src scripts tests
      - run: python scripts/run-tests.py
      - run: python scripts/try-me.py
