name: Web session broker
on:
  push:
    branches: [codex/web-session-broker]
  pull_request:
    paths:
      - 'src/cyber_core/pentest/web_sessions.py'
      - 'tests/test_web_sessions.py'
      - '.github/workflows/web-session-broker.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[reverse,recovery]"
      - run: python -m unittest discover -s tests -p test_web_sessions.py -v
      - run: python -m unittest discover -s tests -v
