name: COFF static symbols
on:
  push:
    branches: [codex/visionft-coff-stage]
  pull_request:
    branches: [main]
    paths:
      - 'src/cyber_core/reverse_engineering/coff*'
      - 'tests/test_coff_symbols.py'
      - 'scripts/check-coff-symbols.py'
      - '.github/workflows/coff-symbols.yml'
permissions:
  contents: read
concurrency:
  group: coff-symbols-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/run-tests.py test_coff_symbols.py
      - name: Install compiler and demanglers on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18
      - name: Real compiled Microsoft COFF and demangling through CORE
        run: python scripts/check-coff-symbols.py
      - run: python -m compileall -q src scripts tests
      - run: python scripts/run-tests.py
