name: OpenAPI inventory
on:
  push:
    branches: [codex/api-inventory]
  pull_request:
    paths: ['src/cyber_core/pentest/**','tests/test_api_inventory.py','.github/workflows/api-inventory.yml']
permissions:
  contents: read
jobs:
  api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Route synthetic HTTPS fixture locally
        if: runner.os == 'Linux'
        run: |
          sudo ip address add 93.184.216.34/32 dev lo
          echo '93.184.216.34 jarvis-fixture.test' | sudo tee -a /etc/hosts
      - run: python scripts/run-tests.py test_api_inventory.py
      - run: python scripts/run-tests.py
        env:
          JARVIS_HTTPS_FIXTURE: ${{ runner.os == 'Linux' && '1' || '0' }}
