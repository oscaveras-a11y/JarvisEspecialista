name: Connected CORE panel
on:
  workflow_dispatch:
  push:
    branches: [codex/connect-core-panel]
  pull_request:
    branches: [main]
    paths: ['src/cyber_core/web_server.py','web/**','tests/test_web_server.py','tests/live-web.spec.cjs','playwright.live.config.cjs','.devcontainer/**','.github/workflows/connected-panel.yml']
permissions:
  contents: read
concurrency:
  group: connected-panel-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  connected:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04,windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install .
      - name: HTTP contracts with real CORE and synthetic files
        run: python scripts/run-tests.py test_web_server.py
      - run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Real connected browser flow
        env:
          CYBER_BETA_TEST_HOME: ${{ runner.temp }}/cyber-connected-browser
        run: npx playwright test --config playwright.live.config.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: connected-panel-${{ matrix.os }}
          path: |
            test-results/
            live-playwright-report/
          retention-days: 7

  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      CYBER_BETA_REAL_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install .
      - name: Prepare the same pinned tools as Codespaces
        run: bash scripts/install-beta-tools.sh
        env:
          CYBER_TOOLS_ROOT: ${{ runner.temp }}/cyber-tools
      - name: Real HTTP to Ghidra and Binwalk
        run: python scripts/run-tests.py test_web_server.py
        env:
          CYBER_GHIDRA_HOME: ${{ runner.temp }}/cyber-tools/ghidra_12.1.4_PUBLIC
          CYBER_BINWALK: ${{ runner.temp }}/cyber-tools/binwalk/bin/binwalk
