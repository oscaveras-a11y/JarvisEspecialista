name: Synthetic API runtime
on:
  push:
    branches: [codex/api-runtime-lab]
  pull_request:
    paths: ['src/cyber_core/pentest/**', 'tests/test_api_runtime.py', '.github/workflows/api-runtime.yml']
permissions:
  contents: read
jobs:
  api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Route existing synthetic HTTPS regression locally
        if: runner.os == 'Linux'
        run: |
          sudo ip address add 93.184.216.34/32 dev lo
          echo '93.184.216.34 jarvis-fixture.test' | sudo tee -a /etc/hosts
      - run: python scripts/run-tests.py test_api_runtime.py
        env:
          JARVIS_API_TLS: ${{ runner.os == 'Linux' && '1' || '0' }}
      - run: python scripts/run-tests.py
        env:
          JARVIS_HTTPS_FIXTURE: ${{ runner.os == 'Linux' && '1' || '0' }}
          JARVIS_API_TLS: ${{ runner.os == 'Linux' && '1' || '0' }}
