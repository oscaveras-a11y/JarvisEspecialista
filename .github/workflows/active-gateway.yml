name: Active gateway
on:
  push:
    branches: [codex/active-gateway]
jobs:
  gateway:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Disposable public-address fixture route
        if: runner.os == 'Linux'
        run: |
          sudo ip address add 93.184.216.34/32 dev lo
          echo "93.184.216.34 jarvis-fixture.test" | sudo tee -a /etc/hosts
      - name: Gateway contracts and real TLS
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export JARVIS_HTTPS_FIXTURE=1; fi
          python -m unittest discover -s tests -p test_active_gateway.py -v
      - name: Full regression
        run: python scripts/run-tests.py
