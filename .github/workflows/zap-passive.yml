name: Scoped passive ZAP
on:
  push:
    branches: [codex/zap-passive]
  pull_request:
    paths: ['src/cyber_core/pentest/passive*', 'src/cyber_core/pentest/zap_driver.py', 'tests/test_passive_zap.py', '.github/workflows/zap-passive.yml']
concurrency:
  group: zap-passive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  passive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Passive adapter contracts
        run: python scripts/run-tests.py test_passive_zap.py
      - name: Prepare disposable Linux fixture and pinned offline backend
        if: runner.os == 'Linux'
        run: |
          sudo ip address add 93.184.216.34/32 dev lo
          echo '93.184.216.34 jarvis-fixture.test' | sudo tee -a /etc/hosts
          docker pull ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
      - name: Real ZAP plus complete regression suite
        run: python scripts/run-tests.py
        env:
          JARVIS_ZAP_REAL: ${{ runner.os == 'Linux' && '1' || '0' }}
          JARVIS_HTTPS_FIXTURE: ${{ runner.os == 'Linux' && '1' || '0' }}
          JARVIS_API_TLS: ${{ runner.os == 'Linux' && '1' || '0' }}
