name: Agent broker offline contracts
on:
  push:
    branches: [codex/agents-broker]
  pull_request:
    branches: [main]
    paths:
      - 'src/cyber_core/agents/**'
      - 'src/cyber_core/orchestrator/broker*.py'
      - 'tests/test_agent*.py'
      - '.github/workflows/agent-contracts.yml'
permissions:
  contents: read
concurrency:
  group: agent-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install on disposable runner
        run: python -m pip install .
      - name: Agent contracts without providers
        run: python scripts/run-tests.py test_agent*.py
      - name: Complete offline suite
        if: ${{ !cancelled() }}
        run: python scripts/run-tests.py
      - name: Dependency and syntax checks
        if: ${{ !cancelled() }}
        run: |
          python -m pip check
          python -m compileall -q src scripts tests
