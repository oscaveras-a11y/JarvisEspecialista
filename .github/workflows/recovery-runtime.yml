name: Recovery runtime diagnosis
on:
  push:
    branches: [codex/visionft-static-analysis]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose-recovery-runtime.py'
      - 'src/cyber_core/external_tool_runtime.py'
      - '.github/workflows/recovery-runtime.yml'
permissions:
  contents: read
concurrency:
  group: recovery-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/run-tests.py test_external_runtime_races.py
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CYBER_REQUIRE_EXTERNAL_TOOLS: '1'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[reverse,recovery]'
      - run: bash scripts/setup-external-recovery-tools.sh
      - name: Repeat actual synthetic recovery with sanitized runtime diagnostics
        run: python scripts/diagnose-recovery-runtime.py
