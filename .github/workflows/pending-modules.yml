name: Pending modules validation
on:
  workflow_dispatch:
  push:
    branches: [codex/finish-pending-modules]
  pull_request:
    branches: [main]
    paths:
      - 'src/cyber_core/cryptanalysis/**'
      - 'src/cyber_core/recovery.py'
      - 'src/cyber_core/cli/**'
      - 'src/cyber_core/operations.py'
      - 'src/cyber_core/reporting/**'
      - 'tests/test_recovery*.py'
      - 'tests/test_operations.py'
      - '.github/workflows/pending-modules.yml'
permissions:
  contents: read
concurrency:
  group: pending-modules-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install only on disposable runner
        run: python -m pip install ".[reverse]"
      - name: Recovery and key contracts
        run: python scripts/run-tests.py "test_recovery*.py"
      - name: Complete suite
        if: ${{ !cancelled() }}
        run: python scripts/run-tests.py
      - name: Synthetic demonstration
        if: ${{ !cancelled() }}
        run: python scripts/demo.py
