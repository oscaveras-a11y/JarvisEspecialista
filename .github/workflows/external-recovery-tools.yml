name: Sixteen real tools together
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/cyber_core/**'
      - 'tests/test_external_recovery_tools.py'
      - 'tests/test_forensics_sleuthkit.py'
      - 'tests/test_research.py'
      - 'tests/test_recovery_rar5.py'
      - 'scripts/setup-reverse-tools-actions.sh'
      - 'scripts/check-real-backends.py'
      - 'scripts/setup-external-recovery-tools.sh'
      - 'config/semgrep-rules/**'
      - '.github/workflows/external-recovery-tools.yml'
permissions:
  contents: read
concurrency:
  group: eight-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[reverse,recovery]'
      - run: python scripts/run-tests.py test_external_recovery_tools.py
  real_tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CYBER_REQUIRE_EXTERNAL_TOOLS: '1'
      CYBER_REQUIRE_RAR5: '1'
      # The disposable Actions runner has normal outbound internet (no proxy
      # needed), unlike the author's own sandboxed session. pip-audit is the
      # one adapter allowed to use it, and only to query the package index.
      CYBER_REQUIRE_PIP_AUDIT_NETWORK: '1'
      # Item 11 (research engine): owner approved network only for an explicit
      # URL the caller names, never a search — narrower than pip-audit/npm-
      # audit's own index lookups, so it gets its own opt-in flag.
      CYBER_REQUIRE_RESEARCH_FETCH_NETWORK: '1'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      POCL_MAX_PTHREAD_COUNT: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[reverse,recovery]'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Provision six real CLIs on ephemeral runner
        id: provision
        timeout-minutes: 15
        run: bash scripts/setup-external-recovery-tools.sh
      - name: Provision Ghidra and Binwalk in the same runner
        run: bash scripts/setup-reverse-tools-actions.sh
      - name: Require real decompilation and Binwalk results through CORE
        run: python scripts/check-real-backends.py
      - name: Require real RAR5 operations
        run: python scripts/run-tests.py test_recovery_rar5.py
      - name: Diagnose synthetic CLI readiness
        run: python scripts/probe-external-recovery.py
      - name: Real encrypted-file and identification contracts
        run: python scripts/run-tests.py test_external_recovery_tools.py
      - name: Real Sleuth Kit partition/entry/recovery contracts
        run: python scripts/run-tests.py test_forensics_sleuthkit.py
      - name: Real explicit-URL research fetch contracts
        run: python scripts/run-tests.py test_research.py
      - name: Complete suite with all sixteen real tools
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: python scripts/run-tests.py
      - name: Synthetic demonstration
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: python scripts/demo.py
