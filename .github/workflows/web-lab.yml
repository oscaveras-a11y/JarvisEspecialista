name: Web synthetic laboratory
on:
  push:
    branches: [codex/web-lab]
  pull_request:
    paths: ['src/cyber_core/web_lab.py','tests/test_web_lab.py','.github/workflows/web-lab.yml']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/run-tests.py test_web_lab.py
      - run: python scripts/run-tests.py
