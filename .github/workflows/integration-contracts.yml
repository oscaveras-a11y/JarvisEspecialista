name: Combined contracts validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integration-contracts.yml'
      - 'scripts/check-integration-contracts.py'
      - 'src/cyber_core/analysis_process/**'
      - 'src/cyber_core/service.py'
      - 'tests/test_process*.py'
      - 'src/cyber_core/investigation/**'
      - 'src/cyber_core/cli/science.py'
      - 'src/cyber_core/cli/reasoning.py'
      - 'src/cyber_core/reporting/**'
      - 'tests/test_reasoning.py'
      - 'scripts/check-reasoning-handoff.py'

permissions:
  contents: read

concurrency:
  group: combined-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined:
    name: Combined / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CANDIDATE_SHA: 00adab4ccc187f517ee8272a29e285087b54e347
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout validation branch and full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Combine immutable candidate inside ephemeral runner
        id: combine
        run: |
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git -c user.name="Integration validation" -c user.email="integration@example.invalid" merge --no-commit --no-ff "$CANDIDATE_SHA"
          git diff --check
          printf 'Candidate commit: %s\n' "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Combination exists only in this disposable runner; no branch is pushed.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install combined package on GitHub runner
        run: python -m pip install .
      - name: Check installed dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q src scripts tests
          cyber --help
      - name: Run complete combined suite
        id: suite
        run: python scripts/run-tests.py
      - name: Probe shared timeout and retry contracts
        if: ${{ !cancelled() && steps.combine.outcome == 'success' && steps.suite.outcome != 'skipped' }}
        run: python scripts/check-integration-contracts.py
      - name: Run combined synthetic demonstration
        if: ${{ !cancelled() && steps.combine.outcome == 'success' && steps.suite.outcome != 'skipped' }}
        run: python scripts/demo.py
      - name: Reproduce item 4 and Claude item 5 memory handoff
        run: python scripts/check-reasoning-handoff.py
