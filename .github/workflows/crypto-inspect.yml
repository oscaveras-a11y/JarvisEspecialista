name: Crypto static inspection
on:
  push:
    branches: [codex/crypto-inspect, codex/readiness-integration]
  pull_request:
    branches: [main, codex/readiness-integration]
    paths: ['src/cyber_core/reverse_engineering/crypto*', 'tests/test_crypto_inspect.py', '.github/workflows/crypto-inspect.yml']
permissions:
  contents: read
concurrency:
  group: crypto-inspect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/run-tests.py test_crypto_inspect.py
      - run: python scripts/run-tests.py
  real-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install . capstone==5.0.6
      - run: bash scripts/setup-reverse-tools-actions.sh
      - run: python scripts/run-tests.py test_crypto_inspect.py
        env:
          CYBER_CRYPTO_REAL: '1'
