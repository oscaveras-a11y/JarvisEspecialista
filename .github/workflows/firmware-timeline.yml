name: Firmware timeline synthetic tests
on:
  push:
    branches: [codex/firmware-timeline]
  pull_request:
    paths: ['src/cyber_core/forensics/firmware_timeline.py','tests/test_firmware_timeline.py','.github/workflows/firmware-timeline.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/run-tests.py test_firmware_timeline.py
      - run: python scripts/run-tests.py
