name: Multi-format recovery validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/cyber_core/cryptanalysis/**'
      - 'src/cyber_core/cli/**'
      - 'tests/test_recovery*.py'
      - 'pyproject.toml'
      - '.github/workflows/recovery-formats.yml'
permissions:
  contents: read
concurrency:
  group: recovery-formats-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install synthetic format-test dependencies on disposable runner
        run: python -m pip install ".[reverse,recovery]"
      - name: Require all multi-format test dependencies
        run: python -c "import pyzipper, py7zr, pypdf, msoffcrypto"
      - name: Dependency compatibility
        run: python -m pip check
      - name: PDF failure and candidate progression contracts
        run: python scripts/run-tests.py test_recovery_pdf_errors.py
      - name: New encrypted format contracts
        run: python scripts/run-tests.py test_recovery_formats.py
      - name: Complete offline suite
        if: ${{ !cancelled() }}
        run: python scripts/run-tests.py
      - name: Synthetic end-to-end demonstration
        if: ${{ !cancelled() }}
        run: python scripts/demo.py
