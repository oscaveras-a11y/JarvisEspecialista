# Referencia: install.ps1/install.sh criam a configuracao em .state/config.toml.
[engine]
default = "ollama"

[engine.ollama]
host = "http://127.0.0.1:11434"

[intelligence]
default_model = "gemma4:e4b"

[agent]
default_agent = "none"

[security]
profile = "personal"

[speech]
backend = "faster-whisper"
model = "base"
language = "pt"
device = "cpu"
compute_type = "int8"
tts_backend = "kokoro"
voice_id = "pf_dora"

[server]
host = "127.0.0.1"
port = 8000

[analytics]
enabled = false

[telemetry]
enabled = false
